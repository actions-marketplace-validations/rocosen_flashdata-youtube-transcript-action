name: YouTube Timestamped Transcript - FlashData
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Export existing automatic-caption segments with timestamps and video
          citations for a retrieval pipeline.
        id: data
        uses: rocosen/flashdata-youtube-transcript-action@v0.1.0
        with:
          api-key: ${{ secrets.FLASHDATA_API_KEY }}
          video-id: dQw4w9WgXcQ
          options-json: '{"language":"en","auto":true}'
      - name: Save data for the next pipeline stage
        uses: actions/upload-artifact@v4
        with:
          name: youtube-transcript
          path: ${{ steps.data.outputs.artifact-directory }}
          retention-days: 7
